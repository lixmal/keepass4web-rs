name: Tests

on:
  push:
    branches: [ "master" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # gate on the bug-catching lint groups; style lints are not enforced yet
      - name: Clippy
        run: cargo clippy --all-targets -- -D clippy::correctness -D clippy::suspicious

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-Ctarget-cpu=sandybridge -Ctarget-feature=+aes,+sse2,+sse4.1,+ssse3"
      RUST_BACKTRACE: full
    steps:
      - uses: actions/checkout@v7
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose

  frontend-e2e:
    name: Frontend E2E Tests
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-Ctarget-cpu=sandybridge -Ctarget-feature=+aes,+sse2,+sse4.1,+ssse3"
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build frontend
        run: npm run build
      - name: Build backend
        run: cargo build --release
      - name: Run Playwright tests
        run: npm test
        env:
          CI: true
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  all-tests-passed:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [backend, frontend-e2e]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.backend.result }}" != "success" ]; then
            echo "Backend tests failed"
            exit 1
          fi
          if [ "${{ needs.frontend-e2e.result }}" != "success" ]; then
            echo "Frontend e2e tests failed"
            exit 1
          fi
