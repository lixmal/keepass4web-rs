[package]
name = "keepass4web-rs"
authors = ["Viktor Liu"]
version = "1.0.0"
edition = "2024"
rust-version = "1.88"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
anyhow = { version = "1.0.104", features = ["backtrace"] }
actix-server = "2.9.0"
actix-files = "0.6.10"
actix-web = "4.15.0"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros", "fs"] }
tokio-util = { version = "0.7.19", features = ["io", "io-util", "compat"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
serde_millis = "0.1.1"
base64 = "0.22.1"
humantime-serde = "1.1.1"
postcard = { version = "1.1.3", features = ["use-std"] }
env_logger = { version = "0.11.11", features = [] }
log = "0.4.34"
rand = "0.8.8"
keepass = { git = "https://github.com/lixmal/keepass-rs", features = ["serialization", "save_kdbx4"] }
zeroize = { version = "1.9.0", features = ["derive", "std"] }
secrecy = "0.8.0"
uuid = { version = "1.26.0", features = ["v4"] }
regex = "1.13.1"
mime = "0.3.17"
aes-gcm = { version = "0.10.3", features = ["zeroize", "std"] }
constant_time_eq = "0.3.1"
url = { version = "2.5.8", features = ["serde"] }
openidconnect = "3.5.0"
async-trait = "0.1.92"
ldap3 = { version = "0.11.5", default-features = false, features = ["tls-rustls"] }
reqwest = { version = "0.11.27", features = ["rustls", "__tls", "rustls-tls", "stream", "webpki-roots", "rustls-tls-webpki-roots"], default-features = false }
futures = "0.3.34"
futures-util = { version = "0.3.34", default-features = false, features = ["io"] }
htpasswd-verify = { git = "https://github.com/twistedfall/htpasswd-verify", rev = "ff14703083cbd639f7d05622b398926f3e718d61" }

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils = { version = "0.2.4", features = ["std"] }

[dev-dependencies]
mockito = "1.7.2"
